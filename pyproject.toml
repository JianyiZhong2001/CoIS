[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cois-segmentation"
version = "0.1.0"
description = "Context-guided interval and set supervision for multi-source segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["cois*"]
